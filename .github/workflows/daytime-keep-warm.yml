name: Daytime keep warm

on:
  schedule:
    - cron: "30,40,50 2 * * *"
    - cron: "*/10 3-16 * * *"
    - cron: "0,10,20,30 17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wait for randomized jitter
        run: sleep "$((RANDOM % 46))"

      - name: Check app and database readiness
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"

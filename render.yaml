services:
  - type: web
    name: looky-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: VISION_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
